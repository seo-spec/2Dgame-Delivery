<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="1650" viewBox="0 0 1280 1650"><rect width="1280" height="1650" fill="#22323d"/><style>text{font-family:sans-serif;fill:#f1e8d2;font-size:18px}</style><text x="12" y="25">배송 동선 주변 카메라 표본 — 연속 주행 검증 화면 아님</text><text x="12" y="64">1. 출발지 (750,450)</text><a href="world-750-450.png" xlink:href="world-750-450.png"><image x="0" y="72" width="640" height="360" href="world-750-450.png" xlink:href="world-750-450.png"/></a><text x="652" y="64">2. 북쪽 연결로 (1050,900)</text><a href="world-1050-900.png" xlink:href="world-1050-900.png"><image x="640" y="72" width="640" height="360" href="world-1050-900.png" xlink:href="world-1050-900.png"/></a><text x="12" y="464">3. 북쪽 교차로 (1050,1350)</text><a href="world-1050-1350.png" xlink:href="world-1050-1350.png"><image x="0" y="472" width="640" height="360" href="world-1050-1350.png" xlink:href="world-1050-1350.png"/></a><text x="652" y="464">4. 파란 주택 (750,1650)</text><a href="world-750-1650.png" xlink:href="world-750-1650.png"><image x="640" y="472" width="640" height="360" href="world-750-1650.png" xlink:href="world-750-1650.png"/></a><text x="12" y="864">5. 북쪽 상점 (1450,1650)</text><a href="world-1450-1650.png" xlink:href="world-1450-1650.png"><image x="0" y="872" width="640" height="360" href="world-1450-1650.png" xlink:href="world-1450-1650.png"/></a><text x="652" y="864">6. 동쪽 연결 교차로 (1950,1350)</text><a href="world-1950-1350.png" xlink:href="world-1950-1350.png"><image x="640" y="872" width="640" height="360" href="world-1950-1350.png" xlink:href="world-1950-1350.png"/></a><text x="12" y="1264">7. 동쪽 상점 (2250,1050)</text><a href="world-2250-1050.png" xlink:href="world-2250-1050.png"><image x="0" y="1272" width="640" height="360" href="world-2250-1050.png" xlink:href="world-2250-1050.png"/></a></svg>
